# =====================================================================
# pyproject.toml - OPTIMIZADO y CONSOLIDADO
# =====================================================================
#
# METADATA DEL ARCHIVO
# Nombre: pyproject_OPTIMIZADO_1_0_0.toml
# Version: 1.0.0 (MAJOR.MINOR.PATCH)
# Proyecto: IACT - IVR Analytics & Customer Tracking
# Fecha Creacion: 2026-01-12
# Ultima Actualizacion: 2026-01-12
# Autor: Claude (Anthropic)
#
# HISTORIAL DE VERSIONES
# 1.0.0 (2026-01-12) - Version inicial
#   - Consolidacion de pytest.ini, coveragerc, pytest.integration.ini
#   - Implementacion import-mode=importlib
#   - Habilitacion strict mode
#   - Optimizacion paths y coverage
#   - Documentacion completa de markers
#
# ARCHIVOS ELIMINADOS (consolidados aqui)
# - pytest.ini -> Consolidado en [tool.pytest.ini_options]
# - coveragerc -> Consolidado en [tool.coverage.*]
# - pytest.integration.ini -> Usar markers en su lugar: pytest -m integration
#
# ARCHIVOS REQUERIDOS (dependencias)
# - src/callcentersite/settings/testing.py (debe existir)
# - tests/conftest.py (fixtures globales)
# - tests/unit/, tests/integration/, tests/use_cases/ (estructura)
#
# CUMPLIMIENTO
# - STD_001: Sin emojis, marcadores ASCII
# - Pytest Official Documentation: Good Integration Practices
# - RBAC v5.1.1: Sistema de funciones atomicas
#
# =====================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "callcentersite"
version = "0.1.0"
description = "CallCenter Django API Application"
requires-python = ">=3.12"
readme = "readme.md"
authors = [
    {name = "CallCenter Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django :: 4.2",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]

# =====================================================================
# SETUPTOOLS CONFIGURATION - SRC LAYOUT
# =====================================================================

[tool.setuptools.packages.find]
where = ["src"]
include = ["callcentersite", "data_centralization", "dora_metrics"]

# =====================================================================
# DJANGO-STUBS CONFIGURATION
# =====================================================================

[tool.django-stubs]
# Settings para desarrollo con type checking
django_settings_module = "callcentersite.settings.development"

# =====================================================================
# PYTEST CONFIGURATION - CONSOLIDADO
# =====================================================================
# Fuente: pytest official documentation - Good Integration Practices
# https://docs.pytest.org/en/stable/explanation/goodpractices.html

[tool.pytest.ini_options]
# Django settings module para tests
# IMPORTANTE: Sin prefijo "src." porque setuptools ya configura los paths
DJANGO_SETTINGS_MODULE = "callcentersite.settings.testing"

# Strict mode (nuevo en pytest 9.0)
# Detecta problemas de configuracion tempranamente
strict = true

# Test discovery patterns
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Test paths - SOLO buscar en directorio tests/
# CRITICO: No usar "." porque busca en todo el proyecto
testpaths = ["tests"]

# Opciones adicionales
addopts = [
    # Import mode - Recomendado para nuevos proyectos
    "--import-mode=importlib",

    # Output
    "--verbose",
    "--tb=short",

    # Strict markers - Error si marker no registrado
    "--strict-markers",

    # Coverage - Solo codigo del proyecto
    "--cov=src/callcentersite",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",

    # Django - Sin migraciones (mas rapido)
    # Requiere: settings.testing con MIGRATION_MODULES
    "--nomigrations",

    # Performance
    "--reuse-db",  # Reusar DB entre ejecuciones (pytest-django)

    # Opcional: Ejecucion paralela (requiere pytest-xdist)
    # Descomentar para usar:
    # "-n", "auto",
]

# Markers personalizados
# Usar con: pytest -m unit, pytest -m integration, etc.
markers = [
    "unit: Unit tests (fast, no DB, no external dependencies) - pytest -m unit",
    "integration: Integration tests (requires DB, API endpoints, full flows) - pytest -m integration",
    "slow: Slow running tests (>1s) - deselect with 'pytest -m \"not slow\"'",
    "auth: Authentication module tests",
    "rbac: RBAC and permissions tests (RBAC v5.1.1 - funciones atomicas)",
    "etl: ETL pipeline tests",
    "use_case: Use case orchestration tests",
]

# Filter warnings - Control granular
# MEJOR que -p no:warnings porque permite selectividad
filterwarnings = [
    # Ignorar deprecation warnings de Django/DRF
    "ignore::DeprecationWarning:django.*",
    "ignore::DeprecationWarning:rest_framework.*",
    "ignore::PendingDeprecationWarning",

    # Convertir UserWarning a error (nuestro codigo)
    # "error::UserWarning",
]

# =====================================================================
# COVERAGE CONFIGURATION - CONSOLIDADO
# =====================================================================
# Fuente: coverage.py documentation
# Consolida configuracion de coveragerc

[tool.coverage.run]
# Source - Solo codigo del proyecto callcentersite
# NOTA: Excluye data_centralization y dora_metrics
# Si quieres incluirlos, cambia a: source = ["src"]
source = ["src/callcentersite"]

# Branch coverage - Mide cobertura de ramas
branch = true

# Omit - Archivos a excluir de coverage
omit = [
    # Migraciones
    "*/migrations/*",

    # Tests
    "*/tests/*",
    "*/test_*.py",
    "*/*_test.py",

    # Cache
    "*/__pycache__/*",

    # Virtual environments
    "*/venv/*",
    "*/virtualenv/*",
    "*/env/*",
    "*/.venv/*",

    # Django management
    "manage.py",

    # Django config files
    "*/settings/*",
    "*/wsgi.py",
    "*/asgi.py",

    # Admin (opcional - descomentar si no quieres cubrir admin)
    # "*/admin.py",
]

[tool.coverage.report]
# Exclude lines - Lineas a ignorar en reportes
exclude_lines = [
    # Standard
    "pragma: no cover",
    "def __repr__",
    "def __str__",

    # Debug
    "if self.debug:",
    "if settings.DEBUG:",

    # Testing
    "raise AssertionError",
    "raise NotImplementedError",

    # Type checking
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@typing.overload",

    # Main
    "if __name__ == .__main__.:",

    # Abstract methods
    "@abstractmethod",
    "@abc.abstractmethod",
]

# Precision en porcentajes
precision = 2

# Mostrar lineas faltantes
show_missing = true

# Saltar archivos completamente cubiertos en reporte
skip_covered = false

# Fallar si coverage menor a este porcentaje
# Descomentar para habilitar:
# fail_under = 80

[tool.coverage.html]
# Directorio para reporte HTML
directory = "htmlcov"

# =====================================================================
# RUFF CONFIGURATION - CODE LINTING
# =====================================================================

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "migrations",
    ".venv",
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "C",     # flake8-comprehensions
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "DJ",    # flake8-django
    "EM",    # flake8-errmsg
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate
    "PL",    # pylint
    "TRY",   # tryceratops
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in argument defaults (Django uses this)
    "DJ001",   # avoid nullable CharField/TextField (legacy code)
    "S101",    # use of assert (OK in tests)
    "S105",    # hardcoded password (false positives)
    "S106",    # hardcoded password (false positives)
    "PLR0913", # too many arguments
    "PLR2004", # magic value in comparison
    "TRY003",  # avoid long messages outside exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "PLR2004", # magic values OK in tests
    "ARG",     # unused arguments in fixtures
    "PT",      # pytest style rules more lenient
]
"**/migrations/*.py" = ["ALL"]
"manage.py" = ["T201"]  # print allowed in manage.py
"settings/**/*.py" = [
    "S105",    # hardcoded passwords in settings
    "F405",    # may be undefined from star imports
]

[tool.ruff.lint.isort]
known-first-party = ["callcentersite"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =====================================================================
# BLACK CONFIGURATION - CODE FORMATTING
# =====================================================================

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

# =====================================================================
# ISORT CONFIGURATION - IMPORT SORTING
# =====================================================================

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["callcentersite"]
skip = ["migrations"]

# =====================================================================
# MYPY CONFIGURATION - TYPE CHECKING
# =====================================================================

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = false  # Gradual typing - enable later
disallow_any_unimported = false
disallow_any_generics = false
disallow_subclassing_any = false
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

exclude = [
    "migrations/",
    "venv/",
    "tests/",
]

[[tool.mypy.overrides]]
module = [
    "*.migrations.*",
    "*.tests.*",
    "manage",
]
ignore_errors = true

# =====================================================================
# BANDIT CONFIGURATION - SECURITY LINTING
# =====================================================================

[tool.bandit]
exclude_dirs = [
    "tests",
    "migrations",
    ".venv",
]
skips = [
    "B101",  # assert_used - OK in tests
    "B601",  # paramiko_calls - not applicable
]

# =====================================================================
# PYLINT CONFIGURATION
# =====================================================================

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
]

[tool.pylint.format]
max-line-length = 100

# =====================================================================
# FIN DEL ARCHIVO
# =====================================================================