[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "callcentersite"
version = "0.1.0"
description = "CallCenter Django API Application"
requires-python = ">=3.12"
readme = "readme.md"
authors = [{name = "CallCenter Team"}]
classifiers = [
"Development Status :: 3 - Alpha",
"Framework :: Django :: 4.2",
"Intended Audience :: Developers",
"Programming Language :: Python :: 3.12",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["callcentersite", "data_centralization", "dora_metrics"]

[tool.django-stubs]
django_settings_module = "src.callcentersite.settings.development"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "src.callcentersite.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["."]
addopts = "-v --strict-markers --tb=short --cov=. --cov-report=term-missing --cov-report=html --cov-branch --nomigrations"
markers = [
"unit: Unit tests",
"integration: Integration tests",
"slow: Slow running tests",
"django_db: Tests that require database access",
]

[tool.coverage.run]
source = ["src"]
omit = [
"*/migrations/*",
"*/tests/*",
"*/test_*.py",
"*/__pycache__/*",
"manage.py",
"*/wsgi.py",
"*/asgi.py",
]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", ".git", "__pycache__", ".mypy_cache", ".pytest_cache", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP", "N", "YTT", "ASYNC", "S", "BLE", "FBT", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "ISC", "ICN", "G", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "ARG", "PTH", "ERA", "PL", "TRY", "RUF"]
ignore = ["E501", "B008", "DJ001", "S101", "S105", "S106", "PLR0913", "PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ARG"]
"**/migrations/*.py" = ["ALL"]
"manage.py" = ["T201"]
"settings/**/*.py" = ["S105", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["callcentersite"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
\.eggs
| \.git
| \.hg
| \.mypy_cache
| \.tox
| \.venv
| build
| dist
| migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["callcentersite"]
skip = ["migrations"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_any_unimport = false
imported = false
disallow_any_generics = false
disallow_subclassing_any = false
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

exclude = [
    "migrations/",
    "venv/",
    "tests/",
]

[[tool.mypy.overrides]]
module = [
    "*.migrations.*",
    "*.tests.*",
    "manage",
]
ignore_errors = true

[tool.bandit]
exclude_dirs = [
    "tests",
    "migrations",
    ".venv",
]
skips = [
    "B101",  # assert_used - OK in tests
    "B601",  # paramiko_calls - not applicable
]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
]

[tool.pylint.format]
max-line-length = 100

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true
