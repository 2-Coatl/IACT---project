  /api/v1/audit/logs/:
    get:
      operationId: v1_audit_logs_list
      description: |-
        ViewSet de solo lectura para AuditLog.

        Endpoints:
        - GET /api/v1/audit/logs/ - Listar logs
        - GET /api/v1/audit/logs/{id}/ - Detalle de log

        INMUTABLE (CNST-009): Solo permite GET, no POST/PUT/DELETE.

        Filtros disponibles:
        - user: ID de usuario
        - action: Tipo de acción (LOGIN, CREATE, etc.)
        - result: SUCCESS o FAILURE
        - timestamp: Rango de fechas

        Búsqueda:
        - resource: Buscar en nombre de recurso

        Ordenamiento:
        - timestamp (default: -timestamp)
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: result
        schema:
          type: string
          title: Resultado
          enum:
          - FAILURE
          - SUCCESS
        description: |-
          * `SUCCESS` - Exito
          * `FAILURE` - Fallo
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogSummaryList'
          description: ''
