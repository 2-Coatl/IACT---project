components:
  schemas:
    AuditLog:
      type: object
      description: |-
        Serializer para AuditLog (readonly).

        Muestra información completa del log de auditoría.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
          title: Usuario
        user_username:
          type: string
          readOnly: true
          nullable: true
        user_full_name:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
          title: Accion
          description: LOGIN, LOGOUT, CREATE, UPDATE, DELETE, etc
        resource:
          type: string
          readOnly: true
          title: Recurso
          description: Recurso afectado
        result:
          allOf:
          - $ref: '#/components/schemas/ResultEnum'
          readOnly: true
          title: Resultado
        timestamp:
          type: string
          format: date-time
          readOnly: true
          title: Fecha/Hora
        ip_address:
          type: string
          readOnly: true
          nullable: true
          title: IP
        user_agent:
          type: string
          readOnly: true
        details:
          readOnly: true
          nullable: true
          title: Detalles adicionales
      required:
      - action
      - details
      - id
      - ip_address
      - resource
      - result
      - timestamp
      - user
      - user_agent
      - user_full_name
      - user_username
    AuditLogSummary:
      type: object
      description: |-
        Serializer resumido para listados.

        Omite detalles pesados como user_agent.
      properties:
        id:
          type: integer
          readOnly: true
        user_username:
          type: string
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
          title: Accion
          description: LOGIN, LOGOUT, CREATE, UPDATE, DELETE, etc
        resource:
          type: string
          readOnly: true
          title: Recurso
          description: Recurso afectado
        result:
          allOf:
          - $ref: '#/components/schemas/ResultEnum'
          readOnly: true
          title: Resultado
        timestamp:
          type: string
          format: date-time
          readOnly: true
          title: Fecha/Hora
        ip_address:
          type: string
          readOnly: true
          nullable: true
          title: IP
      required:
      - action
      - id
      - ip_address
      - resource
      - result
      - timestamp
      - user_username
    AvatarUploadRequest:
      type: object
      description: Serializer para subir avatar.
      properties:
        avatar:
          type: string
          format: binary
          description: 'Imagen de perfil (max 2MB, formatos: jpg, png, gif)'
      required:
      - avatar
    BulkGrantAccess:
      type: object
      description: |-
        Serializer para otorgar acceso a múltiples usuarios.

        CLEAN_CODE v3.0.1: Bulk operation serializer.

        Usado en endpoint POST /services/{id}/bulk-grant-access/
      properties:
        user_ids:
          type: array
          items:
            type: integer
          maxItems: 100
          minItems: 1
        reason:
          type: string
          maxLength: 500
      required:
      - user_ids
    BulkGrantAccessRequest:
      type: object
      description: |-
        Serializer para otorgar acceso a múltiples usuarios.

        CLEAN_CODE v3.0.1: Bulk operation serializer.

        Usado en endpoint POST /services/{id}/bulk-grant-access/
      properties:
        user_ids:
          type: array
          items:
            type: integer
          maxItems: 100
          minItems: 1
        reason:
          type: string
          maxLength: 500
      required:
      - user_ids
    CallRecord:
      type: object
      description: |-
        Serializer para CallRecord.

        Campos adicionales calculados:
            - answer_rate (read-only): Tasa de respuesta %
            - abandonment_rate (read-only): Tasa de abandono %
            - avg_duration_seconds (read-only): Duración promedio
