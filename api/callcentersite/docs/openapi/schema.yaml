    PasswordResetConfirmRequest:
      type: object
      description: |-
        Serializer para confirmar reset de password.

        Campos:
        - uidb64 (required) - User ID codificado
        - token (required) - Token de reset
        - new_password (required) - Nuevo password

        Flujo:
        1. Usuario recibe email con link
        2. Click en link con uidb64 y token
        3. Ingresa nuevo password
        4. Se valida token y se actualiza password

        Example:
            >>> serializer = PasswordResetConfirmSerializer(data={
            ...     'uidb64': 'MQ',
            ...     'token': 'abc123-def456',
            ...     'new_password': 'NewPass456'
            ... })
            >>> if serializer.is_valid():
            ...     user = serializer.save()
      properties:
        uidb64:
          type: string
          minLength: 1
          description: User ID codificado (del link de email)
        token:
          type: string
          minLength: 1
          description: Token de reset (del link de email)
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          description: Nuevo password (mínimo 8 caracteres)
      required:
      - new_password
      - token
      - uidb64
    PasswordResetRequestRequest:
      type: object
      description: |-
        Serializer para solicitar reset de password.

        Campos:
        - email (required)

        Flujo:
        1. Usuario envía email
        2. Se genera token
        3. Se envía email con link

        Example:
            >>> serializer = PasswordResetRequestSerializer(data={
            ...     'email': 'user@company.com'
            ... })
            >>> if serializer.is_valid():
            ...     success = serializer.save()
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Email del usuario
      required:
      - email
