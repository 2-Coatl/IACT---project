  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Login JWT custom.

        POST /api/v1/auth/login/
        {
            "username": "user",
            "password": "pass"
        }

        Returns:
            {
                "access": "...",
                "refresh": "...",
                "username": "user",
                "email": "user@example.com"
            }
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
