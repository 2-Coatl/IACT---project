# ==============================================================================
# PYTEST CONFIGURATION - IACT Call Center System
# ==============================================================================
[pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing
pythonpath = callcentersite
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests callcentersite/tests

# Markers
markers =
    unit: Unit tests (fast, no DB)
    integration: Integration tests (DB required)
    e2e: End-to-end tests (full stack)
    slow: Slow tests (>1s)
    skip_ci: Skip in CI pipeline

# Coverage
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=callcentersite/apps
    --cov=callcentersite/config
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
    -p no:warnings

# Django
django_find_project = false

# Plugins
#required_plugins = pytest-django pytest-cov factory-boy
